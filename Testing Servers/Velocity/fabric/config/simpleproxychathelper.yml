# SimpleProxyChatHelper configuration (Fabric)
# Saved to config/simpleproxychathelper.yml in your server directory on first run.

# Host of the proxy running SimpleProxyChat
proxy-host: "proxy"

# Port the proxy TCP server is listening on (must match websocket-port in the proxy config)
proxy-port: 8766

# Shared secret (must match websocket-secret in the proxy config)
proxy-secret: "SUPERSECRETWEBHOOK"

# The name of this server exactly as configured in the proxy (velocity.toml or BungeeCord config.yml)
server-name: "fabric"
