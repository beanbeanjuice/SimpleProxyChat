name: Create Release

on:
  release:
    types: [ released ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gradle-build:
    name: Gradle JDK 21 Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout Code
        uses: actions/checkout@v6
      -
        name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      -
        name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'adopt'
      -
        name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
      -
        name: Build with Gradle
        run: gradle shadowJar
      -
        name: Upload JARs to GitHub Release
        run: |
          for file in libs/*.jar; do
            echo "Uploading $file"
            gh release upload "${{ github.event.release.tag_name }}" "$file"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      -
        # Saved for 1 day so publish jobs can download without re-building.
        name: Save JARs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          path: libs/*.jar
          retention-days: 1

  publish-hangar:
    name: Publish to Hangar
    needs: [ gradle-build ]
    runs-on: ubuntu-latest
    steps:
      -
        name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: libs/
      -
        name: Publish Proxy Plugin to Hangar
        uses: milkdrinkers/Hangar-Publish@v2
        with:
          api_token: ${{ secrets.HANGAR_API_TOKEN }}
          # The URL slug of your project on Hangar.
          # e.g. https://hangar.papermc.io/YourName/SimpleProxyChat → slug is SimpleProxyChat
          slug: PLACEHOLDER_HANGAR_PROJECT_SLUG
          version: ${{ github.event.release.tag_name }}
          channel: Release
          description: ${{ github.event.release.body }}
          # JSON array: each entry maps one JAR to one or more platforms.
          # Valid platform values: PAPER, VELOCITY, WATERFALL
          files: |
            [
              {
                "path": "libs/SimpleProxyChat-*.jar",
                "platforms": ["PAPER", "VELOCITY", "WATERFALL"]
              }
            ]
          # Minimum platform versions supported.
          # Use exact versions or semver ranges (e.g. ">=1.21", "1.21.x", "1.21.4").
          # PLACEHOLDER: replace these with your actual supported version ranges.
          platform_dependencies: |
            {
              "PAPER": ["PLACEHOLDER_PAPER_VERSION_RANGE"],
              "VELOCITY": ["PLACEHOLDER_VELOCITY_VERSION_RANGE"],
              "WATERFALL": ["PLACEHOLDER_WATERFALL_VERSION_RANGE"]
            }

  publish-modrinth-proxy:
    name: Publish Proxy Plugin to Modrinth
    needs: [ gradle-build ]
    runs-on: ubuntu-latest
    steps:
      -
        name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: libs/
      -
        # Loaders include proxy platforms (velocity, bungeecord, waterfall) and server
        # platforms (paper, spigot) because the Spigot helper is bundled in this JAR.
        # Adjust the loader list if you narrow platform support in future releases.
        #
        # PLACEHOLDER_GAME_VERSIONS_PROXY: replace with the Minecraft versions you support,
        # one per line, exactly matching Modrinth's version slugs (e.g. 1.21.1, not 1.21.x).
        # Another CI change is updating Fabric/NeoForge MC version lists — align this
        # list with your supported server versions once that work is finalised.
        name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: PLACEHOLDER_MODRINTH_PROJECT_ID
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: libs/SimpleProxyChat-*.jar
          name: SimpleProxyChat ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: release
          loaders: |
            velocity
            bungeecord
            waterfall
            paper
            spigot
          game-versions: |
            PLACEHOLDER_GAME_VERSIONS_PROXY

  publish-modrinth-fabric:
    name: Publish Fabric Helper to Modrinth
    # Runs after proxy upload completes to avoid parallel API races on the same project.
    needs: [ publish-modrinth-proxy ]
    runs-on: ubuntu-latest
    steps:
      -
        name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: libs/
      -
        # Version uses +fabric suffix so it is unique within the project.
        # PLACEHOLDER_GAME_VERSIONS_FABRIC: replace with the Minecraft versions the
        # Fabric helper supports, one per line.
        name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: PLACEHOLDER_MODRINTH_PROJECT_ID
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: libs/SimpleProxyChatHelper-Fabric-*.jar
          name: Fabric Helper ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}+fabric
          version-type: release
          loaders: |
            fabric
          game-versions: |
            PLACEHOLDER_GAME_VERSIONS_FABRIC

  publish-modrinth-neoforge:
    name: Publish NeoForge Helper to Modrinth
    # Runs after fabric upload completes to avoid parallel API races on the same project.
    needs: [ publish-modrinth-fabric ]
    runs-on: ubuntu-latest
    steps:
      -
        name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: libs/
      -
        # Version uses +neoforge suffix so it is unique within the project.
        # PLACEHOLDER_GAME_VERSIONS_NEOFORGE: replace with the Minecraft versions the
        # NeoForge helper supports, one per line.
        name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: PLACEHOLDER_MODRINTH_PROJECT_ID
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: libs/SimpleProxyChatHelper-NeoForge-*.jar
          name: NeoForge Helper ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}+neoforge
          version-type: release
          loaders: |
            neoforge
          game-versions: |
            PLACEHOLDER_GAME_VERSIONS_NEOFORGE
